name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          suffix="${GOOS}-${GOARCH}"
          if [ -n "${GOARM}" ]; then suffix="${suffix}v${GOARM}"; fi
          out="dist/ai-noleak-${suffix}"
          mkdir -p "$out"
          go build -o "$out/noleakd" ./cmd/noleakd
          go build -o "$out/noleak-watch" ./cmd/noleak-watch
          go build -o "$out/noleak" ./cmd/noleak
          cp README.md LICENSE SPEC.md FUTURE_WORK.md "$out/"
          tar -C dist -czf "dist/ai-noleak-${suffix}.tar.gz" "ai-noleak-${suffix}"

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-noleak-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: ai-noleak-*
          merge-multiple: true

      - name: Consolidate Checksums and Generate Body
        run: |
          cd release-artifacts
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          
          echo "## ai-noleak ${{ github.ref_name }}" > ../release-body.md
          echo "" >> ../release-body.md
          echo "This release contains prebuilt binaries for Linux and macOS (darwin)." >> ../release-body.md
          echo "" >> ../release-body.md
          echo "### SHA256 Checksums" >> ../release-body.md
          echo "\`\`\`text" >> ../release-body.md
          cat SHA256SUMS.txt >> ../release-body.md
          echo "\`\`\`" >> ../release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS.txt
          body_path: release-body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
