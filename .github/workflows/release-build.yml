name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          suffix="${GOOS}-${GOARCH}"
          if [ -n "${GOARM}" ]; then suffix="${suffix}v${GOARM}"; fi
          out="dist/ai-noleak-${suffix}"
          mkdir -p "$out"
          go build -o "$out/noleakd" ./cmd/noleakd
          go build -o "$out/noleak-watch" ./cmd/noleak-watch
          go build -o "$out/noleak" ./cmd/noleak
          cp README.md LICENSE SPEC.md FUTURE_WORK.md "$out/"
          tar -C dist -czf "dist/ai-noleak-${suffix}.tar.gz" "ai-noleak-${suffix}"

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-noleak-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
